name: Create GitHub release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify release version and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#[vV]}"
          CONFIG_VERSION=$(node -p "require('./app.json').expo.version")
          CONFIG_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          if [[ ! "$TAG_NAME" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version tag, got $TAG_NAME"
            exit 1
          fi
          if [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match app.json version $CONFIG_VERSION"
            exit 1
          fi
          mapfile -t NOTES_FILES < <(find releases -mindepth 2 -maxdepth 2 -path "releases/v${CONFIG_VERSION}-${CONFIG_CODE}/patch-notes.md" -print)
          if [ "${#NOTES_FILES[@]}" -eq 1 ]; then
            NOTES_FILE="${NOTES_FILES[0]}"
            grep -Fqx -- "- Version: ${CONFIG_VERSION}" "$NOTES_FILE"
            grep -Fqx -- "- Version code: ${CONFIG_CODE}" "$NOTES_FILE"
            echo "Found matching patch notes at $NOTES_FILE"
          elif [ "${#NOTES_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple patch-note files found for version ${CONFIG_VERSION} code ${CONFIG_CODE}" >&2
            exit 1
          elif gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing GitHub release notes for $TAG_NAME"
          else
            echo "::error::Missing patch notes or an existing Release Please release for $TAG_NAME."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci --include=dev

      - name: Run recovery checks
        run: npm run verify:recovery

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing required release signing secret: $value"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/peacocknotes-release-key.jks
          {
            echo 'storeFile=peacocknotes-release-key.jks'
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Create release with patch notes and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONFIG_VERSION=$(node -p "require('./app.json').expo.version")
          CONFIG_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          APK_PATH="android/app/build/outputs/apk/release/peacocknotes-v${CONFIG_VERSION}-${CONFIG_CODE}.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected versioned APK was not produced: $APK_PATH" >&2
            ls -la android/app/build/outputs/apk/release >&2
            exit 1
          fi
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK_DIR" ] || [ ! -d "$ANDROID_SDK_DIR/build-tools" ]; then
            echo "::error::Android SDK build-tools directory is unavailable"
            exit 1
          fi
          AAPT2=$(find "$ANDROID_SDK_DIR/build-tools" -type f -name aapt2 -perm -111 | sort -V | tail -n 1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 was not found"
            exit 1
          fi
          BADGING=$("$AAPT2" dump badging "$APK_PATH")
          grep -Fq "package: name='com.roy.peacocknotes' versionCode='${CONFIG_CODE}' versionName='${CONFIG_VERSION}'" <<<"$BADGING"
          NOTES_FILE="releases/v${CONFIG_VERSION}-${CONFIG_CODE}/patch-notes.md"
          if [ -n "$REQUESTED_TAG" ]; then
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
            NOTES_ARGS=(--generate-notes)
          elif [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "No patch notes found at $NOTES_FILE; falling back to generated notes" >&2
            NOTES_ARGS=(--generate-notes)
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH#Peacock Notes APK" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            if [ -z "$REQUESTED_TAG" ] && [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --notes-file "$NOTES_FILE"
            fi
          else
            gh release create "$TAG_NAME" "$APK_PATH#Peacock Notes APK" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              "${NOTES_ARGS[@]}" \
              --title "Peacock Notes $TAG_NAME"
          fi

          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
