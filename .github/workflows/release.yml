name: Create GitHub release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/peacocknotes-release-key.jks
          {
            echo 'storeFile=peacocknotes-release-key.jks'
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Create release with generated notes and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name 'peacocknotes-*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "No versioned APK produced; release output:" >&2
            ls -la android/app/build/outputs/apk/release >&2
            exit 1
          fi
          gh release create "$TAG_NAME" "$APK_PATH#Peacock Notes APK" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Peacock Notes $TAG_NAME"
